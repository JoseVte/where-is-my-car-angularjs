<dialog
    #dialog
    class="m-auto w-[min(90vw,24rem)] rounded-3xl bg-surface p-6 text-on-surface shadow-xl backdrop:bg-black/40"
    [attr.aria-labelledby]="id + '-title'"
    [attr.aria-describedby]="id + '-message'"
    (close)="finish(false)"
>
    <h2 [id]="id + '-title'" class="text-xl font-bold">{{ title() | t }}</h2>
    <p [id]="id + '-message'" class="mt-2 text-on-surface-variant">{{ message() | t }}</p>

    <label class="mt-4 flex min-h-11 cursor-pointer items-center gap-3 text-sm">
        <input type="checkbox" class="size-5 accent-primary-fill" [checked]="dontAskAgain()" (change)="dontAskAgain.set($any($event.target).checked)" />
        {{ 'dont_ask_again' | t }}
    </label>

    <div class="mt-4 flex justify-end gap-2">
        <button type="button" class="action min-h-11 px-4" (click)="finish(false)">{{ 'cancel' | t }}</button>
        <button type="button" class="action min-h-11 px-4 text-error" (click)="confirm()">{{ 'delete' | t }}</button>
    </div>
</dialog>
